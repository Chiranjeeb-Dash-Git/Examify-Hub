version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
    volumes:
      - ./backend/data:/app/data
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

# Optional named volumes (kept for future use)
volumes:
  backend_data:
    driver: local
